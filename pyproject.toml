[project]
name = "cac-sign"
version = "0.2.0"
description = "Convert Word forms to PDF, detect fields, fill and CAC-sign locally on a Mac."
readme = "README.md"
license = "MIT"
authors = [{ name = "Aaron Montgomery" }]
keywords = ["cac", "pdf", "docx", "digital signature", "smart card", "piv", "macos"]
classifiers = [
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Security :: Cryptography",
]
# Tested on the versions in uv.lock; older pyHanko and pikepdf behave differently in the checks.
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0",
    "pikepdf>=10.0",
    "pyhanko[pkcs11]>=0.35",
    # cac_sign.py: sign through macOS's built-in smart-card support (system PIN window)
    "pyobjc-framework-Security>=10; sys_platform == 'darwin'",
    # cac_sign_editor.py: render PDF pages for the review page
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/Euda1mon1a/cac-sign"
Issues = "https://github.com/Euda1mon1a/cac-sign/issues"

[project.scripts]
cac-sign = "cac_sign_app:cli"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The wheel puts the tool's files, unchanged, into one package, cac_sign_app; the launcher
# (cac_sign_launch.py) becomes its __init__ and lets the modules import each other by name.
[tool.hatch.build.targets.wheel]
bypass-selection = true
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.force-include]
"cac_sign_launch.py" = "cac_sign_app/__init__.py"
"cac_sign.py" = "cac_sign_app/cac_sign.py"
"cac_signing.py" = "cac_sign_app/cac_signing.py"
"cac_sign_editor.py" = "cac_sign_app/cac_sign_editor.py"
"cac_sign_finder.py" = "cac_sign_app/cac_sign_finder.py"
"pdf_readers.py" = "cac_sign_app/pdf_readers.py"
"document_inputs.py" = "cac_sign_app/document_inputs.py"
"field_detection.py" = "cac_sign_app/field_detection.py"
"editor.html" = "cac_sign_app/editor.html"
"identity.example.json" = "cac_sign_app/identity.example.json"
"profiles" = "cac_sign_app/profiles"
"quick-action" = "cac_sign_app/quick-action"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
exclude = ["/AGENTS.md"]

# The curl installer runs the scripts in place from ~/.cac-sign; uv sync doesn't install the project.
[tool.uv]
package = false
